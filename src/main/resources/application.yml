server:
  # Cloud Run injects PORT; 8080 keeps local runs unchanged
  port: ${PORT:8080}

  # Cloud Run terminates TLS at its front end and forwards to the container over plain
  # HTTP, so without this Spring believes the request scheme is http. Springdoc then
  # publishes "http://<host>" as the OpenAPI server URL, and Swagger UI - which was
  # loaded over https - fires Try-it-out calls at a different origin. The browser
  # reports that as a CORS/mixed-content failure. Honouring X-Forwarded-Proto fixes the
  # generated URL at the source.
  #
  # Safe here because every request reaches the container through Google's front end,
  # which sets these headers itself; do not enable this where the app is directly
  # reachable and a client could forge them.
  forward-headers-strategy: framework

# Default profile: local development and the test suite, on in-memory H2.
# The deployed app runs with SPRING_PROFILES_ACTIVE=prod, which replaces this
# datasource with Postgres - see application-prod.yml.

spring:
  application:
    name: quiz-api
  datasource:
    url: jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      # Development aid only - disabled in the prod profile
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    # Off by default in Spring Boot's own warning for a reason: leaving the session
    # open through view rendering lets lazy loads fire outside the service layer.
    open-in-view: false

app:
  admin:
    # Anyone registering with role=ADMIN must supply this code. Override in prod.
    registration-code: ${ADMIN_REGISTRATION_CODE:quiz-admin-2026}

jwt:
  # Dev-only fallback. The prod profile requires JWT_SECRET to be supplied.
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLXF1aXotYXBw}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
