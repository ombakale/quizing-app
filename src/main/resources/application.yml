spring:
  application:
    name: quiz-api
  datasource:
    url: jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      # Development aid only - disabled in the prod profile
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  admin:
    # Anyone registering with role=ADMIN must supply this code. Override in prod.
    registration-code: ${ADMIN_REGISTRATION_CODE:quiz-admin-2026}

jwt:
  # Dev-only fallback. The prod profile requires JWT_SECRET to be supplied.
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLXF1aXotYXBw}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
