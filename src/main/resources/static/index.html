<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Quiz Application</title>
<meta name="theme-color" content="#0d6efd">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.svg">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/app.css">
</head>
<body class="page">
<div id="nav"></div>
<main class="kit-main">
  <div class="kit-narrow">
    <div class="card">
      <div class="pills" role="tablist" aria-label="Authentication mode">
        <button class="pill" role="tab" id="tab-login" aria-selected="true" aria-controls="auth-form" type="button">Login</button>
        <button class="pill" role="tab" id="tab-register" aria-selected="false" aria-controls="auth-form" type="button">Register</button>
      </div>

      <form id="auth-form" novalidate style="margin-top:var(--space-4)">
        <div id="form-error" class="alert alert-danger" role="alert" hidden style="margin-bottom:var(--space-3)"></div>

        <div class="field">
          <label class="label" for="username">Username</label>
          <input class="input" id="username" name="username" autocomplete="username" placeholder="student1">
          <p class="error" id="username-error" hidden></p>
          <p class="help" id="username-help">3–50 characters. Letters, numbers, dot, underscore, hyphen.</p>
        </div>

        <div class="field">
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password">
          <p class="error" id="password-error" hidden></p>
          <p class="help" id="password-help">At least 6 characters.</p>
        </div>

        <div class="field" id="role-field" hidden>
          <label class="label" for="role">Role</label>
          <select class="select" id="role">
            <option value="USER">Student</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>

        <div class="field" id="admincode-field" hidden>
          <label class="label" for="adminCode">Admin registration code</label>
          <input class="input" id="adminCode" type="password" autocomplete="off" placeholder="Required for admin accounts">
          <p class="error" id="adminCode-error" hidden></p>
          <p class="help">Issued by whoever runs this deployment. The server checks it.</p>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Login</button>
      </form>
    </div>

    <p class="help" style="text-align:center;margin-top:var(--space-3)">
      New here? Register as a Student to take a quiz.
    </p>
  </div>
</main>

<script src="/app.js"></script>
<script src="/components/navbar.js"></script>
<script src="/components/form-field.js"></script>
<script src="/components/feedback.js"></script>
<script>
  // Already holding a token: skip the form. An expired token is caught by the
  // first API call on the dashboard, which clears it and sends us back here.
  if (session.get()) location.replace('dashboard.html');

  renderNavbar(document.getElementById('nav'));

  const $ = id => document.getElementById(id);
  const tabs = { login: $('tab-login'), register: $('tab-register') };
  let mode = 'login';

  const fields = {
    username:  { input: $('username'),  error: $('username-error') },
    password:  { input: $('password'),  error: $('password-error') },
    adminCode: { input: $('adminCode'), error: $('adminCode-error') }
  };

  function setMode(next) {
    mode = next;
    for (const [k, btn] of Object.entries(tabs)) btn.setAttribute('aria-selected', String(k === next));
    $('role-field').hidden = next !== 'register';
    $('submit-btn').textContent = next === 'register' ? 'Create account' : 'Login';
    $('password').setAttribute('autocomplete', next === 'register' ? 'new-password' : 'current-password');
    clearFormError($('form-error'));
    for (const f of Object.values(fields)) setFieldError(f.input, f.error, null);
    toggleAdminCode();
  }

  function toggleAdminCode() {
    $('admincode-field').hidden = !(mode === 'register' && $('role').value === 'ADMIN');
  }

  tabs.login.addEventListener('click', () => setMode('login'));
  tabs.register.addEventListener('click', () => setMode('register'));
  $('role').addEventListener('change', toggleAdminCode);

  // Clear a field error as soon as the user starts fixing it.
  for (const f of Object.values(fields)) {
    f.input.addEventListener('input', () => setFieldError(f.input, f.error, null));
  }

  $('auth-form').addEventListener('submit', async e => {
    e.preventDefault();
    const submit = $('submit-btn');
    const username = $('username').value.trim();
    const password = $('password').value;
    const role = mode === 'register' ? $('role').value : null;
    const adminCode = $('adminCode').value.trim();

    clearFormError($('form-error'));

    // Mirror the server's own limits so the first feedback is not a round trip.
    let ok = setFieldError(fields.username.input, fields.username.error, Rules.username(username));
    ok = setFieldError(fields.password.input, fields.password.error, Rules.password(password)) && ok;
    if (mode === 'register') {
      ok = setFieldError(fields.adminCode.input, fields.adminCode.error,
                         Rules.adminCode(adminCode, role)) && ok;
    }
    if (!ok) {
      showFormError($('form-error'), 'Validation failed — check the highlighted fields.');
      return;
    }

    submit.disabled = true;
    try {
      const auth = mode === 'register'
        ? await Api.register({ username, password, role, adminCode: role === 'ADMIN' ? adminCode : undefined })
        : await Api.login({ username, password });
      session.set(auth);
      handoff.clear();
      location.href = 'dashboard.html';
    } catch (err) {
      // fieldErrors -> per field; anything else (401, 403, 409) -> form-level.
      applyApiError(err, fields, $('form-error'));
      submit.disabled = false;
    }
  });

  setMode('login');
</script>
</body>
</html>
