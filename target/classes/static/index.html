<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <!-- Simple Bootstrap CSS for clean UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .navbar-brand { font-weight: bold; }
        .option-btn { width: 100%; text-align: left; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">🎓 Quiz Application</a>
            <div class="d-flex align-items-center" id="navAuth">
                <span class="text-white me-3" id="userInfo"></span>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn" onclick="logout()" style="display:none;">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">

        <!-- 1. Authentication Card (Login / Register) -->
        <div id="authSection" class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <ul class="nav nav-pills nav-justified mb-3" id="pills-tab">
                        <li class="nav-item">
                            <button class="nav-link active" onclick="switchAuthTab('login')">Login</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" onclick="switchAuthTab('register')">Register</button>
                        </li>
                    </ul>

                    <form id="authForm" onsubmit="handleAuth(event)">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" required minlength="3">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" required minlength="4">
                        </div>
                        <div class="mb-3" id="roleGroup" style="display: none;">
                            <label class="form-label">Role</label>
                            <select id="role" class="form-select" onchange="toggleAdminCode()">
                                <option value="USER">Student (User)</option>
                                <option value="ADMIN">Admin</option>
                            </select>
                        </div>
                        <div class="mb-3" id="adminCodeGroup" style="display: none;">
                            <label class="form-label">Admin registration code</label>
                            <input type="password" id="adminCode" class="form-control" placeholder="Required for admin accounts">
                        </div>
                        <div id="authError" class="alert alert-danger py-2" style="display: none;"></div>
                        <button type="submit" class="btn btn-primary w-100" id="authSubmitBtn">Login</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 2. Main Dashboard (After Login) -->
        <div id="dashboardSection" style="display: none;">
            
            <!-- Admin Panel -->
            <div id="adminPanel" class="mb-4" style="display: none;">
                <div class="card p-4">
                    <h4 class="card-title text-success mb-3">🛠️ Admin: Create New Quiz</h4>
                    <form onsubmit="handleCreateQuiz(event)">
                        <div class="mb-3">
                            <label class="form-label">Quiz Title</label>
                            <input type="text" id="quizTitle" class="form-control" required placeholder="e.g., Java Basics">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" id="quizDesc" class="form-control" placeholder="e.g., Test core concepts">
                        </div>
                        
                        <h6 class="mt-3">Question Details</h6>
                        <div class="mb-2">
                            <input type="text" id="qText" class="form-control mb-2" required placeholder="Question: e.g. What keyword defines a class?">
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="text" id="opt1" class="form-control" required placeholder="Option 1 (Correct)">
                                </div>
                                <div class="col-6">
                                    <input type="text" id="opt2" class="form-control" required placeholder="Option 2 (Wrong)">
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success mt-2">Create Quiz</button>
                    </form>
                </div>
            </div>

            <!-- Student Quiz List -->
            <div class="row" id="quizListRow">
                <div class="col-12">
                    <h4 class="mb-3">📋 Available Quizzes</h4>
                    <div id="quizList" class="row g-3">
                        <!-- Quizzes rendered dynamically -->
                    </div>
                </div>
            </div>

            <!-- Taking Quiz Section -->
            <div id="takeQuizSection" style="display: none;" class="card p-4 mt-3">
                <h3 id="activeQuizTitle" class="text-primary"></h3>
                <p id="activeQuizDesc" class="text-muted"></p>
                <hr>

                <div id="questionsContainer"></div>

                <div class="mt-4">
                    <button class="btn btn-success btn-lg w-100" onclick="submitActiveQuiz()">Submit Quiz</button>
                    <button class="btn btn-secondary mt-2 w-100" onclick="cancelQuiz()">Cancel</button>
                </div>
            </div>

            <!-- Score Result Modal / Section -->
            <div id="resultSection" style="display: none;" class="card p-4 mt-3 text-center">
                <h2 class="text-success mb-2">🎉 Quiz Completed!</h2>
                <h4 id="resultQuizTitle" class="text-muted mb-3"></h4>
                <div class="display-3 font-weight-bold my-3" id="resultScore"></div>
                <h5 id="resultPercentage" class="text-info"></h5>
                <hr>
                <button class="btn btn-primary mt-3" onclick="backToDashboard()">Back to Quizzes</button>
            </div>

        </div>

    </div>

    <script>
        const API_URL = "http://localhost:8080/api";
        let authMode = "login";
        let activeQuiz = null;
        let selectedAnswers = {}; // questionId -> selectedOptionId

        // Initialize view state
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            const username = localStorage.getItem("username");
            const role = localStorage.getItem("role");

            if (token && username) {
                showDashboard(username, role);
            }
        });

        function switchAuthTab(mode) {
            authMode = mode;
            document.querySelectorAll("#pills-tab .nav-link").forEach(el => el.classList.remove("active"));
            event.target.classList.add("active");
            document.getElementById("roleGroup").style.display = mode === "register" ? "block" : "none";
            toggleAdminCode();
            document.getElementById("authSubmitBtn").innerText = mode === "register" ? "Register" : "Login";
            document.getElementById("authError").style.display = "none";
        }

        function toggleAdminCode() {
            const isAdminRegister = authMode === "register" && document.getElementById("role").value === "ADMIN";
            document.getElementById("adminCodeGroup").style.display = isAdminRegister ? "block" : "none";
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const role = document.getElementById("role").value;
            const adminCode = document.getElementById("adminCode").value.trim();
            const errorDiv = document.getElementById("authError");

            errorDiv.style.display = "none";

            const endpoint = authMode === "register" ? "/auth/register" : "/auth/login";
            const payload = authMode === "register" ? { username, password, role, adminCode } : { username, password };

            try {
                const res = await fetch(API_URL + endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.message || data || "Authentication failed");
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("username", data.username);
                localStorage.setItem("role", data.role);

                showDashboard(data.username, data.role);
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
            }
        }

        function showDashboard(username, role) {
            document.getElementById("authSection").style.display = "none";
            document.getElementById("dashboardSection").style.display = "block";
            document.getElementById("userInfo").innerText = `Logged in: ${username} (${role})`;
            document.getElementById("logoutBtn").style.display = "block";

            if (role === "ADMIN") {
                document.getElementById("adminPanel").style.display = "block";
            } else {
                document.getElementById("adminPanel").style.display = "none";
            }

            loadQuizzes();
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function loadQuizzes() {
            const token = localStorage.getItem("token");
            try {
                const res = await fetch(API_URL + "/quizzes", {
                    headers: { "Authorization": "Bearer " + token }
                });
                const quizzes = await res.json();
                
                const listDiv = document.getElementById("quizList");
                listDiv.innerHTML = "";

                if (quizzes.length === 0) {
                    listDiv.innerHTML = "<p class='text-muted'>No quizzes available yet. Log in as ADMIN to create one!</p>";
                    return;
                }

                quizzes.forEach(q => {
                    listDiv.innerHTML += `
                        <div class="col-md-4">
                            <div class="card h-100 p-3">
                                <h5>${q.title}</h5>
                                <p class="text-muted flex-grow-1">${q.description || 'No description'}</p>
                                <button class="btn btn-outline-primary btn-sm" onclick="startQuiz(${q.id})">Start Quiz</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function startQuiz(quizId) {
            const token = localStorage.getItem("token");
            try {
                const res = await fetch(API_URL + "/quizzes/" + quizId, {
                    headers: { "Authorization": "Bearer " + token }
                });
                activeQuiz = await res.json();
                selectedAnswers = {};

                document.getElementById("quizListRow").style.display = "none";
                document.getElementById("takeQuizSection").style.display = "block";
                document.getElementById("resultSection").style.display = "none";

                document.getElementById("activeQuizTitle").innerText = activeQuiz.title;
                document.getElementById("activeQuizDesc").innerText = activeQuiz.description || "";

                const container = document.getElementById("questionsContainer");
                container.innerHTML = "";

                activeQuiz.questions.forEach((q, qIndex) => {
                    let optionsHtml = "";
                    q.options.forEach(o => {
                        optionsHtml += `
                            <div class="form-check my-2">
                                <input class="form-check-input" type="radio" name="q_${q.id}" id="opt_${o.id}" value="${o.id}" onchange="selectOption(${q.id}, ${o.id})">
                                <label class="form-check-label" for="opt_${o.id}">
                                    ${o.text}
                                </label>
                            </div>
                        `;
                    });

                    container.innerHTML += `
                        <div class="card p-3 my-3">
                            <h5>Q${qIndex + 1}. ${q.text}</h5>
                            ${optionsHtml}
                        </div>
                    `;
                });
            } catch (err) {
                alert("Failed to load quiz");
            }
        }

        function selectOption(qId, oId) {
            selectedAnswers[qId] = oId;
        }

        async function submitActiveQuiz() {
            if (!activeQuiz) return;
            const token = localStorage.getItem("token");

            const answersPayload = Object.keys(selectedAnswers).map(qId => ({
                questionId: parseInt(qId),
                selectedOptionId: selectedAnswers[qId]
            }));

            try {
                const res = await fetch(API_URL + "/quizzes/" + activeQuiz.id + "/submit", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ answers: answersPayload })
                });

                const result = await res.json();

                document.getElementById("takeQuizSection").style.display = "none";
                document.getElementById("resultSection").style.display = "block";

                document.getElementById("resultQuizTitle").innerText = result.quizTitle;
                document.getElementById("resultScore").innerText = `${result.score} / ${result.totalQuestions}`;
                document.getElementById("resultPercentage").innerText = `Score: ${result.percentage}%`;
            } catch (err) {
                alert("Failed to submit quiz");
            }
        }

        function cancelQuiz() {
            document.getElementById("takeQuizSection").style.display = "none";
            document.getElementById("quizListRow").style.display = "block";
        }

        function backToDashboard() {
            document.getElementById("resultSection").style.display = "none";
            document.getElementById("quizListRow").style.display = "block";
            loadQuizzes();
        }

        async function handleCreateQuiz(e) {
            e.preventDefault();
            const token = localStorage.getItem("token");

            const title = document.getElementById("quizTitle").value.trim();
            const description = document.getElementById("quizDesc").value.trim();
            const qText = document.getElementById("qText").value.trim();
            const opt1 = document.getElementById("opt1").value.trim();
            const opt2 = document.getElementById("opt2").value.trim();

            const payload = {
                title,
                description,
                questions: [
                    {
                        text: qText,
                        options: [
                            { text: opt1, correct: true },
                            { text: opt2, correct: false }
                        ]
                    }
                ]
            };

            try {
                const res = await fetch(API_URL + "/admin/quizzes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("Quiz created successfully!");
                    document.getElementById("quizTitle").value = "";
                    document.getElementById("quizDesc").value = "";
                    document.getElementById("qText").value = "";
                    document.getElementById("opt1").value = "";
                    document.getElementById("opt2").value = "";
                    loadQuizzes();
                } else {
                    alert("Failed to create quiz (Admin token required)");
                }
            } catch (err) {
                alert("Error creating quiz");
            }
        }
    </script>
</body>
</html>
